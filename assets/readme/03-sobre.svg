<text x="36" y="84" fill="#edf1fa" font-size="30" font-weight="600" >Entre pessoas, dados</text>
<text x="36" y="121" fill="#edf1fa" font-size="30" font-weight="600" >e boas perguntas.</text>
<text x="36" y="161" fill="#b7c3d8" font-size="17" font-weight="400" >Mais de 3 anos de experiência em People Analytics e BI.</text>
<text x="36" y="189" fill="#b7c3d8" font-size="17" font-weight="400" >Transformo dados de RH e das unidades de negócio em indicadores,</text>
<text x="36" y="217" fill="#b7c3d8" font-size="17" font-weight="400" >dashboards e análises para apoiar decisões com clareza e contexto.</text>
