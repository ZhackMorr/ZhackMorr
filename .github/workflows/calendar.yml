name: Atualizar calendário de contribuições

on:
  schedule:
    - cron: '23 8 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/calendar.yml'
      - 'scripts/calendar.py'

permissions:
  contents: write

concurrency:
  group: profile-calendar
  cancel-in-progress: false

jobs:
  calendar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - name: Gerar calendário com dados reais
        env:
          GH_TOKEN: ${{ github.token }}
          PROFILE_USER: ${{ github.repository_owner }}
        run: python3 scripts/calendar.py
      - name: Publicar imagem atualizada
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/readme/04-atividade.svg
          if ! git diff --cached --quiet; then
            git commit -m 'Atualiza calendário de contribuições'
            git push origin HEAD:main
          fi
